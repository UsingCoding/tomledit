[tools]
go = "1.27.1"
rust = "1.99.0"

[env]
# rust:1.99.0, linux/amd64
TOMLEDIT_WASM_BUILDER_IMAGE = "rust@sha256:9d5e02aa6c7e9c112ed7a4c438900b41f519a792959cd5445c25de42bfb8388b"

[tasks.bootstrap]
description = "Install additional development toolchain components"
run = "rustup target add wasm32-unknown-unknown"

[tasks."rust:fmt"]
description = "Format Rust shim"
dir = "rust"
run = "cargo fmt"

[tasks."rust:lint"]
description = "Lint Rust shim"
dir = "rust"
run = "cargo clippy --target wasm32-unknown-unknown --all-targets -- -D warnings"

[tasks."rust:test"]
description = "Run native Rust tests"
dir = "rust"
run = "cargo test"

[tasks."wasm:build"]
description = "Build TOML editor WebAssembly module in the canonical Linux environment"
run = """
docker run --rm \
  --platform linux/amd64 \
  --env HOST_UID="$(id -u)" \
  --env HOST_GID="$(id -g)" \
  --volume "$PWD:/workspace" \
  --workdir /workspace \
  "$TOMLEDIT_WASM_BUILDER_IMAGE" \
  sh -ec '
    rustup target add wasm32-unknown-unknown
    CARGO_TARGET_DIR=/tmp/tomledit-target cargo build --locked \
      --manifest-path rust/Cargo.toml \
      --target wasm32-unknown-unknown \
      --release
    install -Dm0644 \
      /tmp/tomledit-target/wasm32-unknown-unknown/release/tomledit_wasm.wasm \
      /workspace/internal/wasm/assets/tomledit.wasm
    chown "$HOST_UID:$HOST_GID" /workspace/internal/wasm/assets/tomledit.wasm
  '
"""

[tasks."go:fmt"]
description = "Format Go code"
run = "gofmt -w ."

[tasks."go:test"]
description = "Run Go tests"
run = "go test ./..."

[tasks.test]
description = "Run complete test suite"
depends = ["rust:test", "go:test"]

[tasks.build]
description = "Build library and examples without CGO"
depends = ["wasm:build"]
run = "CGO_ENABLED=0 go build ./..."

[tasks.check]
description = "Run formatting, linting and tests"
depends = ["rust:fmt", "rust:lint", "rust:test", "go:fmt", "go:test"]
